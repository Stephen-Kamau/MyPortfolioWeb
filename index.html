<style>
  :root {
    --bg: oklch(0.972 0.008 80);
    --bg-2: oklch(0.945 0.012 78);
    --ink: oklch(0.20 0.012 60);
    --ink-2: oklch(0.38 0.014 65);
    --ink-3: oklch(0.55 0.014 65);
    --line: oklch(0.85 0.012 70);
    --line-2: oklch(0.90 0.010 70);
    --accent: oklch(0.66 0.16 55);
    --accent-ink: oklch(0.32 0.10 50);
    --paper: oklch(0.985 0.006 80);
    --ink-inv: oklch(0.97 0.008 80);
    /* tokens that intentionally stay dark on light AND on dark (terminal, contact section, project visuals) */
    --terminal-bg: oklch(0.20 0.012 60);
    --terminal-ink: oklch(0.88 0.014 65);
    --visual-bg: oklch(0.96 0.010 78);
    --visual-grid: oklch(0.92 0.010 70);
    --color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: oklch(0.17 0.010 60);
    --bg-2: oklch(0.20 0.012 62);
    --ink: oklch(0.95 0.008 80);
    --ink-2: oklch(0.78 0.012 70);
    --ink-3: oklch(0.62 0.014 70);
    --line: oklch(0.30 0.014 65);
    --line-2: oklch(0.26 0.012 65);
    --accent: oklch(0.74 0.16 55);
    --accent-ink: oklch(0.40 0.12 50);
    --paper: oklch(0.21 0.012 62);
    --ink-inv: oklch(0.18 0.010 60);
    --terminal-bg: oklch(0.13 0.010 60);
    --terminal-ink: oklch(0.88 0.014 65);
    --visual-bg: oklch(0.19 0.010 62);
    --visual-grid: oklch(0.26 0.012 65);
    --color-scheme: dark;
  }
  html { color-scheme: var(--color-scheme); transition: background .25s ease; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background .25s ease, color .25s ease;
  }
  .font-serif { font-family: 'Instrument Serif', 'Times New Roman', serif; font-weight: 400; letter-spacing: -0.01em; }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .accent { color: var(--accent); }
  .ink-2 { color: var(--ink-2); }
  .ink-3 { color: var(--ink-3); }
  .hairline { border-color: var(--line); }
  .hairline-2 { border-color: var(--line-2); }

  /* selection */
  ::selection { background: var(--accent); color: var(--bg); }

  /* utility */
  .label-eyebrow {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .num-eyebrow {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--ink-3);
  }

  /* striped placeholder (used for portrait + project covers) */
  .stripes {
    background-image: repeating-linear-gradient(
      135deg,
      var(--line) 0px,
      var(--line) 1px,
      transparent 1px,
      transparent 8px
    );
    background-color: var(--bg-2);
  }
  .stripes-warm {
    background-image: repeating-linear-gradient(
      135deg,
      oklch(0.82 0.10 55) 0px,
      oklch(0.82 0.10 55) 1px,
      transparent 1px,
      transparent 8px
    );
    background-color: oklch(0.90 0.06 60);
  }
  html[data-theme="dark"] .stripes-warm {
    background-image: repeating-linear-gradient(
      135deg,
      oklch(0.45 0.10 55) 0px,
      oklch(0.45 0.10 55) 1px,
      transparent 1px,
      transparent 8px
    );
    background-color: oklch(0.30 0.06 60);
  }
  .stripes-ink {
    background-image: repeating-linear-gradient(
      135deg,
      oklch(0.32 0.018 65) 0px,
      oklch(0.32 0.018 65) 1px,
      transparent 1px,
      transparent 8px
    );
    background-color: oklch(0.22 0.014 65);
  }

  /* grid bg for hero */
  .grid-faint {
    background-image:
      linear-gradient(to right, color-mix(in oklab, var(--line) 60%, transparent) 1px, transparent 1px),
      linear-gradient(to bottom, color-mix(in oklab, var(--line) 60%, transparent) 1px, transparent 1px);
    background-size: 64px 64px;
  }

  /* gentle blink for terminal */
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .blink { animation: blink 1s steps(1) infinite; }

  /* link underline */
  .link-underline {
    background-image: linear-gradient(currentColor, currentColor);
    background-size: 100% 1px;
    background-repeat: no-repeat;
    background-position: 0 100%;
    padding-bottom: 1px;
    transition: background-size .35s ease;
  }
  .link-underline:hover { background-size: 100% 2px; }

  /* tag chip */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    color: var(--ink-2);
    background: var(--paper);
  }
  .chip.dot::before {
    content: "";
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 999px;
  }

  /* button */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    border-radius: 999px;
    font-weight: 500;
    font-size: 14px;
    transition: transform .2s ease, background .2s ease, color .2s ease, border-color .2s ease;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .btn-primary { background: var(--ink); color: var(--ink-inv); }
  .btn-primary:hover { background: var(--accent); color: var(--ink); }
  .btn-ghost { border-color: var(--line); color: var(--ink); background: transparent; }
  .btn-ghost:hover { border-color: var(--ink); }

  /* card hover */
  .card-hover { transition: transform .35s ease, border-color .35s ease, background .35s ease; }
  .card-hover:hover { border-color: var(--ink); }

  /* sticky side nav rule */
  .v-rule { width: 1px; background: var(--line); }

  /* responsive section padding */
  .section { padding: 96px 0; border-top: 1px solid var(--line); }
  @media (max-width: 720px) {
    .section { padding: 56px 0; }
  }

  /* container */
  .container-x { width: 100%; max-width: 1440px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 720px) {
    .container-x { padding: 0 20px; }
  }

  /* big display number */
  .stat-num {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(48px, 7vw, 84px);
    line-height: 0.95;
    letter-spacing: -0.02em;
  }

  /* marquee */
  .marquee { overflow: hidden; }
  .marquee-track {
    display: flex;
    gap: 48px;
    width: max-content;
    animation: scroll 40s linear infinite;
  }
  @keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* hover image reveal for project rows */
  .row-link {
    position: relative;
    display: grid;
    grid-template-columns: 56px 1fr auto;
    gap: 24px;
    padding: 28px 0;
    border-bottom: 1px solid var(--line);
    align-items: baseline;
    transition: color .25s ease;
  }
  .row-link:hover .row-title { color: var(--accent); }
  .row-link:hover .row-arrow { transform: translate(2px, -2px); }
  .row-arrow { transition: transform .25s ease; }

  /* a tag color reset */
  a { color: inherit; text-decoration: none; }

  /* avatar gradient ring */
  .ring-glow {
    background: conic-gradient(from 120deg, oklch(0.66 0.16 55), oklch(0.85 0.06 70), oklch(0.66 0.16 55));
    padding: 2px;
    border-radius: 999px;
  }

  /* mobile menu */
  .mobile-only { display: none; }
  .desktop-only { display: block; }
  @media (max-width: 900px) {
    .mobile-only { display: block; }
    .desktop-only { display: none; }
  }

  /* arrow icon */
  .arrow-up-right::after {
    content: "↗";
    display: inline-block;
    margin-left: 6px;
    transition: transform .2s ease;
  }
  .arrow-up-right:hover::after { transform: translate(2px, -2px); }

  /* fade in */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeUp .8s ease both; }

  /* focus visible */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
</style>
</head>

  // Apply theme BEFORE React renders to avoid flash
  (function() {
    try {
      const saved = localStorage.getItem('portfolio-theme');
      document.documentElement.setAttribute('data-theme', saved || 'light');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
